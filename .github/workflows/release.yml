name: Release

# Push a tag like v0.5.0 (matching versionName in app/build.gradle.kts) to
# build the release APK and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match versionName $version" >&2
            exit 1
          fi
          echo "VERSION_CODE=$(sed -n 's/.*versionCode = \(.*\)/\1/p' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew :core:protocol:test :core:dsp:test

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENDROP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OPENDROP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No OPENDROP_KEYSTORE_BASE64 secret: the APK will be unsigned."
          fi

      - name: Build release APK
        env:
          OPENDROP_KEYSTORE_PASSWORD: ${{ secrets.OPENDROP_KEYSTORE_PASSWORD }}
          OPENDROP_KEY_ALIAS: ${{ secrets.OPENDROP_KEY_ALIAS }}
          OPENDROP_KEY_PASSWORD: ${{ secrets.OPENDROP_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p out
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *unsigned*)
                # Android refuses to install an unsigned APK ("App not
                # installed"), so sideloadable builds get the debug key.
                # Gradle's output stays unsigned for F-Droid.
                apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
                "$apksigner" sign --ks app/debug.keystore --ks-pass pass:android \
                  --ks-key-alias androiddebugkey --key-pass pass:android \
                  --out "out/opendrop-$GITHUB_REF_NAME.apk" "$apk"
                "$apksigner" verify "out/opendrop-$GITHUB_REF_NAME.apk"
                ;;
              *) cp "$apk" "out/opendrop-$GITHUB_REF_NAME.apk" ;;
            esac
          done

      - name: Release notes
        run: |
          # The fastlane changelog doubles as the GitHub release body;
          # the generated PR list is appended below it.
          changelog="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ -f "$changelog" ]; then
            cp "$changelog" "$RUNNER_TEMP/release-notes.md"
          else
            echo "::warning::No changelog at $changelog; generated notes only."
            touch "$RUNNER_TEMP/release-notes.md"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          prerelease: false
